<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>用户管理 · 会议串场PPT生成器</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  theme: {
    extend: {
      colors: {
        medical: {
          50:  '#EFF7FA',
          100: '#DEEEF5',
          200: '#BDDCEC',
          300: '#8FC4DC',
          400: '#4FA1C1',
          500: '#1A7B9E',
          600: '#14637F',
          700: '#115368',
          800: '#0E4253',
          900: '#0B3542',
        },
      },
      fontFamily: {
        sans: ['-apple-system','BlinkMacSystemFont','PingFang SC','Microsoft YaHei','Noto Sans SC','Segoe UI','sans-serif'],
      },
    },
  },
}
</script>
<style>
  ::selection { background: #BDDCEC; }
</style>
</head>

<body class="bg-[#F4F7F9] min-h-screen text-gray-800 font-sans antialiased">

<!-- ======================= 顶部导航 ======================= -->
<header class="bg-white border-b border-gray-200">
  <div class="max-w-[960px] mx-auto px-6 h-16 flex items-center justify-between">
    <a href="web_prototype.html" class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-xl bg-medical-500 flex items-center justify-center shadow-sm shadow-medical-200">
        <svg class="w-6 h-6 text-white" viewBox="0 0 24 24" fill="currentColor">
          <path fill-rule="evenodd" d="M10 3.5h4a1 1 0 0 1 1 1V9.5h5a1 1 0 0 1 1 1v4a1 1 0 0 1-1 1h-5v5a1 1 0 0 1-1 1h-4a1 1 0 0 1-1-1v-5H4a1 1 0 0 1-1-1v-4a1 1 0 0 1 1-1h5V4.5a1 1 0 0 1 1-1Z" clip-rule="evenodd"/>
        </svg>
      </div>
      <div>
        <h1 class="text-[17px] font-bold text-gray-900 leading-tight">会议串场PPT生成器</h1>
        <p class="text-[11px] text-gray-400 leading-tight tracking-wide">Conference Host Script PPT Generator</p>
      </div>
    </a>
    <div class="flex items-center gap-3">
      <span id="me-name" class="text-sm text-gray-500">…</span>
      <a href="web_prototype.html" class="inline-flex items-center gap-1.5 rounded-lg border border-gray-200 bg-white px-3.5 py-2 text-sm text-gray-500 hover:bg-gray-50 hover:text-gray-700 transition font-medium">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5 3 12m0 0 7.5-7.5M3 12h18"/></svg>
        返回主页
      </a>
      <button type="button" id="btn-logout" class="inline-flex items-center gap-1.5 rounded-lg px-3.5 py-2 text-sm text-gray-400 hover:bg-gray-100 hover:text-red-500 transition font-medium cursor-pointer">退出登录</button>
    </div>
  </div>
</header>

<!-- ======================= 用户管理 ======================= -->
<main class="max-w-[960px] mx-auto px-6 py-8 space-y-5">

  <div class="flex items-center justify-between flex-wrap gap-3">
    <div class="flex items-center gap-2.5">
      <div class="w-9 h-9 rounded-lg bg-medical-50 flex items-center justify-center">
        <svg class="w-5 h-5 text-medical-500" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19.128a9.38 9.38 0 0 0 2.625.372 9.337 9.337 0 0 0 4.121-.952 4.125 4.125 0 0 0-7.533-2.493M15 19.128v-.003c0-1.113-.285-2.16-.786-3.07M15 19.128v.106A12.318 12.318 0 0 1 8.624 21c-2.331 0-4.512-.645-6.374-1.766l-.001-.109a6.375 6.375 0 0 1 11.964-3.07M12 6.375a3.375 3.375 0 1 1-6.75 0 3.375 3.375 0 0 1 6.75 0Zm8.25 2.25a2.625 2.625 0 1 1-5.25 0 2.625 2.625 0 0 1 5.25 0Z"/></svg>
      </div>
      <div>
        <h2 class="text-[15px] font-semibold text-gray-800">用户管理</h2>
        <p class="text-xs text-gray-400 mt-0.5">管理 Web 端账户：创建、重置密码、授予管理员权限、删除</p>
      </div>
    </div>
    <span id="user-count" class="inline-flex items-center gap-1 text-[11px] text-medical-600 bg-medical-50 border border-medical-200 rounded-full px-2.5 py-1">0 个账户</span>
  </div>

  <!-- 新建用户 -->
  <div class="bg-white rounded-2xl border border-gray-200/80 shadow-sm p-6">
    <h3 class="text-sm font-semibold text-gray-800 mb-4">新建用户</h3>
    <div id="create-error" class="hidden mb-3 flex items-start gap-2 rounded-lg bg-red-50 border border-red-200 px-3.5 py-2 text-xs text-red-600">
      <span class="font-bold shrink-0">✕</span><span id="create-error-text" class="flex-1 leading-5"></span>
    </div>
    <div class="grid sm:grid-cols-[1fr_1fr_auto_auto] gap-3 items-start">
      <div>
        <label for="new-username" class="text-xs font-medium text-gray-600">用户名</label>
        <input type="text" id="new-username" placeholder="2-64 个字符"
               class="mt-1.5 w-full rounded-lg border border-gray-200 bg-gray-50 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-medical-200 focus:border-medical-300">
      </div>
      <div>
        <label for="new-password" class="text-xs font-medium text-gray-600">初始密码</label>
        <input type="text" id="new-password" placeholder="至少 4 位"
               class="mt-1.5 w-full rounded-lg border border-gray-200 bg-gray-50 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-medical-200 focus:border-medical-300">
      </div>
      <label class="flex items-center gap-2 mt-6 cursor-pointer select-none">
        <input type="checkbox" id="new-is-admin" class="w-4 h-4 rounded accent-medical-500">
        <span class="text-xs text-gray-600">设为管理员</span>
      </label>
      <button type="button" id="btn-create" class="mt-5 inline-flex items-center gap-1.5 rounded-lg bg-medical-500 hover:bg-medical-600 text-white px-4 py-2 text-sm font-medium transition cursor-pointer">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15"/></svg>
        创建
      </button>
    </div>
  </div>

  <!-- 用户列表 -->
  <div class="bg-white rounded-2xl border border-gray-200/80 shadow-sm overflow-hidden">
    <div class="px-6 py-4 border-b border-gray-100">
      <h3 class="text-sm font-semibold text-gray-800">账户列表</h3>
    </div>
    <div id="user-list" class="divide-y divide-gray-100">
      <div class="px-6 py-8 text-center text-xs text-gray-400">加载中…</div>
    </div>
  </div>

  <p class="flex items-center gap-1.5 text-[11px] text-gray-400 px-1">
    <svg class="w-3.5 h-3.5 shrink-0" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="m11.25 11.25.041-.02a.75.75 0 0 1 1.063.852l-.708 2.836a.75.75 0 0 0 1.063.853l.041-.021M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Zm-9-3.75h.008v.008H12V8.25Z"/></svg>
    重置密码 / 删除账户会使该用户的登录立即失效。删除用户不影响其已生成的历史任务文件。
  </p>
</main>

<!-- ======================= Toast 容器 ======================= -->
<div id="toast-container" class="fixed top-4 right-4 z-50 flex flex-col gap-2 w-80 max-w-[90vw]"></div>

<!-- ======================= 应用逻辑 ======================= -->
<script>
(function () {
  'use strict';

  var DEFAULT_API_BASE = location.protocol === 'file:'
    ? 'http://127.0.0.1:8000'
    : location.origin;

  var me = null; // 当前登录用户

  function $(id) { return document.getElementById(id); }
  var TOKEN_KEY = 'pptmaker_session_token';
  function apiBase() {
    // 通过后端访问时固定用同源地址，避免 localhost/127.0.0.1 混用导致会话丢失
    if (location.protocol !== 'file:') return location.origin;
    return (localStorage.getItem('pptmaker_api_base') || DEFAULT_API_BASE).replace(/\/+$/, '');
  }
  function sessionToken() {
    try { return sessionStorage.getItem(TOKEN_KEY) || ''; } catch (e) { return ''; }
  }
  function authFetch(url, options) {
    var opt = Object.assign({}, options || {}, { credentials: 'include' });
    var tk = sessionToken();
    if (tk) {
      opt.headers = Object.assign({}, opt.headers || {}, { 'X-Session-Token': tk });
    }
    return fetch(url, opt);
  }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function toast(type, text, ms) {
    var t = {
      success: { icon: '✓', cls: 'bg-emerald-500' },
      error: { icon: '✕', cls: 'bg-red-500' },
      info: { icon: 'ℹ', cls: 'bg-medical-500' },
    }[type] || { icon: 'ℹ', cls: 'bg-medical-500' };
    var el = document.createElement('div');
    el.className = 'flex items-start gap-2 rounded-xl text-white text-sm shadow-lg px-4 py-3 ' + t.cls;
    el.innerHTML = '<span class="font-bold leading-5">' + t.icon + '</span><span class="flex-1 leading-5 break-all">' + esc(text) + '</span>';
    $('toast-container').appendChild(el);
    setTimeout(function () {
      el.style.transition = 'opacity .3s';
      el.style.opacity = '0';
      setTimeout(function () { el.remove(); }, 320);
    }, ms || 4500);
  }

  async function api(path, options) {
    var res;
    try {
      res = await authFetch(apiBase() + path, options);
    } catch (e) {
      throw new Error('无法连接后端服务（' + apiBase() + '）。请先启动：python -m uvicorn main_web:app --port 8000');
    }
    if (!res.ok) {
      var detail = '';
      try { var j = await res.json(); detail = j.detail || ''; } catch (e) {}
      var err = new Error(detail || ('请求失败 HTTP ' + res.status));
      err.status = res.status;
      throw err;
    }
    try { return await res.json(); } catch (e) { return {}; }
  }

  // ---------------- 用户列表渲染 ----------------
  function renderUsers(users) {
    $('user-count').textContent = users.length + ' 个账户';
    var box = $('user-list');
    if (!users.length) {
      box.innerHTML = '<div class="px-6 py-8 text-center text-xs text-gray-400">暂无账户</div>';
      return;
    }
    box.innerHTML = users.map(function (u) {
      var isSelf = me && u.id === me.id;
      var role = u.is_admin
        ? '<span class="inline-flex items-center gap-1 text-[11px] font-medium text-amber-600 bg-amber-50 rounded-full px-2 py-0.5">管理员</span>'
        : '<span class="inline-flex items-center gap-1 text-[11px] font-medium text-gray-500 bg-gray-100 rounded-full px-2 py-0.5">普通用户</span>';
      var keyState = u.api_key_configured
        ? '<span class="text-[11px] text-emerald-600">已配置</span>'
        : '<span class="text-[11px] text-gray-400">未配置</span>';
      var actions =
        '<button type="button" data-admin-toggle="' + u.id + '" data-next="' + (!u.is_admin) + '" class="text-[11px] text-medical-600 hover:text-medical-700 font-medium cursor-pointer ' + (isSelf && u.is_admin ? 'opacity-40 pointer-events-none' : '') + '">' +
          (u.is_admin ? '取消管理员' : '设为管理员') + '</button>' +
        '<button type="button" data-pwd-reset="' + u.id + '" class="text-[11px] text-medical-600 hover:text-medical-700 font-medium cursor-pointer">重置密码</button>' +
        '<button type="button" data-user-del="' + u.id + '" class="text-[11px] text-red-400 hover:text-red-500 font-medium cursor-pointer ' + (isSelf ? 'opacity-40 pointer-events-none' : '') + '">删除</button>';
      return '<div class="px-6 py-3.5 flex items-center gap-3 flex-wrap">' +
        '<div class="w-9 h-9 shrink-0 rounded-full bg-gradient-to-br from-medical-400 to-medical-600 text-white flex items-center justify-center text-sm font-semibold">' + esc((u.username || '?').slice(0, 1)) + '</div>' +
        '<div class="min-w-0 flex-1">' +
        '<p class="text-sm font-medium text-gray-800 truncate">' + esc(u.username) + (isSelf ? '<span class="ml-1.5 text-[11px] text-gray-400">（当前登录）</span>' : '') + '</p>' +
        '<p class="text-[11px] text-gray-400 mt-0.5">注册于 ' + esc((u.created_at || '').replace('T', ' ').slice(0, 16)) + ' · DeepSeek Key ' + keyState + '</p>' +
        '</div>' +
        role +
        '<div class="flex items-center gap-3 shrink-0">' + actions + '</div>' +
        '</div>';
    }).join('');
  }

  async function loadUsers() {
    try {
      var data = await api('/api/users');
      renderUsers(data.users || []);
    } catch (e) {
      toast('error', '加载用户列表失败：' + e.message, 7000);
    }
  }

  // ---------------- 新建用户 ----------------
  function showCreateError(msg) {
    $('create-error-text').textContent = msg;
    $('create-error').classList.remove('hidden');
  }
  function hideCreateError() {
    $('create-error').classList.add('hidden');
  }
  $('btn-create').addEventListener('click', async function () {
    hideCreateError();
    var username = $('new-username').value.trim();
    var pwd = $('new-password').value;
    if (username.length < 2) { showCreateError('用户名至少 2 个字符'); return; }
    if (pwd.length < 4) { showCreateError('密码至少 4 位'); return; }
    try {
      var data = await api('/api/users', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          username: username,
          password: pwd,
          is_admin: $('new-is-admin').checked,
        }),
      });
      $('new-username').value = '';
      $('new-password').value = '';
      $('new-is-admin').checked = false;
      toast('success', '账户「' + (data.user && data.user.username) + '」已创建');
      loadUsers();
    } catch (e) {
      showCreateError(e.message);
    }
  });

  // ---------------- 列表操作（事件委托） ----------------
  document.addEventListener('click', async function (e) {
    var t = e.target.closest ? e.target.closest('[data-user-del]') : null;
    if (t) {
      var uid = parseInt(t.getAttribute('data-user-del'), 10);
      if (!window.confirm('确定删除该账户？其生成任务的历史文件不受影响。')) return;
      try {
        await api('/api/users/' + uid, { method: 'DELETE' });
        toast('success', '账户已删除');
        loadUsers();
      } catch (err) { toast('error', '删除失败：' + err.message, 7000); }
      return;
    }
    var p = e.target.closest ? e.target.closest('[data-pwd-reset]') : null;
    if (p) {
      var pid = parseInt(p.getAttribute('data-pwd-reset'), 10);
      var np = window.prompt('为该账户设置新密码（至少 4 位）：');
      if (np === null) return;
      if (np.length < 4) { toast('error', '密码至少 4 位'); return; }
      try {
        await api('/api/users/' + pid + '/password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: np }),
        });
        toast('success', '密码已重置，该用户需重新登录');
      } catch (err) { toast('error', '重置失败：' + err.message, 7000); }
      return;
    }
    var a = e.target.closest ? e.target.closest('[data-admin-toggle]') : null;
    if (a) {
      var aid = parseInt(a.getAttribute('data-admin-toggle'), 10);
      var next = a.getAttribute('data-next') === 'true';
      if (!window.confirm(next ? '确定将该账户设为管理员？' : '确定取消该账户的管理员权限？')) return;
      try {
        await api('/api/users/' + aid + '/admin', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ is_admin: next }),
        });
        toast('success', '角色已更新');
        loadUsers();
      } catch (err) { toast('error', '操作失败：' + err.message, 7000); }
      return;
    }
  });

  // ---------------- 退出登录 ----------------
  $('btn-logout').addEventListener('click', async function () {
    try { await authFetch(apiBase() + '/api/logout', { method: 'POST' }); } catch (e) {}
    try { sessionStorage.removeItem(TOKEN_KEY); } catch (e) {}
    window.location.href = 'login.html';
  });

  // ---------------- 启动：登录 + 管理员校验 ----------------
  (async function () {
    try {
      var data = await api('/api/me');
      me = data.user || {};
      if (!me.is_admin) {
        toast('error', '需要管理员权限才能访问本页', 6000);
        setTimeout(function () { window.location.href = 'web_prototype.html'; }, 1200);
        return;
      }
      $('me-name').textContent = me.username + '（管理员）';
      loadUsers();
    } catch (e) {
      if (e.status === 401) {
        window.location.href = 'login.html';
        return;
      }
      toast('error', '加载失败：' + e.message, 7000);
    }
  })();
})();
</script>
</body>
</html>
